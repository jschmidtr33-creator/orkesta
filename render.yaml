# Despliegue alternativo en Render (Blueprint): misma imagen y servicios que en Railway.
# Render → New → Blueprint → elegir este repositorio. Pide las variables marcadas sync: false.
envVarGroups:
  - name: orkesta-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Generada por Render una sola vez y compartida por web y worker.
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: orkesta-db
    databaseName: orkesta
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: orkesta-web
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: >-
      alembic upgrade head && python -m orkesta.cli bootstrap-admin &&
      python -m orkesta.cli catalog-load
    envVars:
      - fromGroup: orkesta-shared
      - key: DATABASE_URL
        fromDatabase:
          name: orkesta-db
          property: connectionString
      - key: ORKESTA_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: ORKESTA_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ORKESTA_BOOTSTRAP_ORG_NAME
        value: America Digital
      # Campañas: URL pública (enlaces de baja y retorno de Google) y OAuth de Gmail (opcional).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: worker
    name: orkesta-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m orkesta.worker
    envVars:
      - fromGroup: orkesta-shared
      - key: DATABASE_URL
        fromDatabase:
          name: orkesta-db
          property: connectionString
      # Campañas: URL pública (enlaces de baja y retorno de Google) y OAuth de Gmail (opcional).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
