# Despliegue en Render (Blueprint): PostgreSQL + un servicio web con API, app y sitio público.
# Las tablas viven en el esquema "orkesta"; la versión anterior (esquema "public") no se toca.
envVarGroups:
  - name: orkesta-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: orkesta-db
    databaseName: orkesta
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: orkesta-web
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Un solo comando: Render no ejecuta "&&" en el paso previo al despliegue.
    preDeployCommand: python -m orkesta.cli release
    envVars:
      - fromGroup: orkesta-shared
      - key: DATABASE_URL
        fromDatabase:
          name: orkesta-db
          property: connectionString
      - key: ORKESTA_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: ORKESTA_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ORKESTA_BOOTSTRAP_ORG_NAME
        value: America Digital
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
