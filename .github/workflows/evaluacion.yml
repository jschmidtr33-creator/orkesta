name: Evaluación en vivo

# Ejecuta el motor de dominios con internet real contra el conjunto de evaluación.
# Se lanza a mano: Actions → "Evaluación en vivo" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Solo las primeras N empresas (0 = todas)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  dominios:
    name: Dominios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .

      - name: Evaluar
        env:
          DATABASE_URL: postgresql://sin-base@127.0.0.1:1/ninguna
          LIMIT: ${{ inputs.limit }}
        run: |
          python -m orkesta.evaluation.domains data/eval/empresas_mx.csv --out reporte --limit "${LIMIT:-0}"
          cat reporte/reporte.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluacion-dominios
          path: reporte/
          retention-days: 30
