# Diagnóstico del servidor de AWS: estado de los contenedores, cifras de la base y los últimos
# errores de la aplicación. El repositorio es público: los correos y direcciones de conexión se
# ocultan antes de mostrarse.
name: diagnostico-aws

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.AWS_HOST }}
      KEY: ${{ secrets.AWS_SSH_KEY }}
    steps:
      - name: Conexión
        run: |
          install -m 600 /dev/null key.pem && printf '%s\n' "$KEY" > key.pem
          echo "SSH=ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@$HOST" >> "$GITHUB_ENV"

      - name: Estado
        run: |
          $SSH 'sudo bash -s' <<'REMOTE' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<correo>/g; s#(postgres(ql)?(\+psycopg)?://)[^ ]+#\1<oculto>#g'
          cd /opt/orkesta
          echo "==> Contenedores"; docker compose ps --format '{{.Name}} {{.State}} {{.Status}}'
          echo "==> Memoria"; free -m | head -2
          echo "==> Reinicios"; docker inspect orkesta-app-1 --format 'reinicios={{.RestartCount}} oom={{.State.OOMKilled}} salida={{.State.ExitCode}} inicio={{.State.StartedAt}}'
          dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -5
          echo "==> Últimas líneas de la app"; docker compose logs --tail 60 app 2>&1 | grep -v "/api/health" | sed -E "s/[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/<ip>/g"
          echo "==> Cifras"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT 'admin_audit', count(*) FROM orkesta.admin_audit UNION ALL
            SELECT 'users', count(*) FROM orkesta.users UNION ALL
            SELECT 'tenants', count(*) FROM orkesta.tenants UNION ALL
            SELECT 'contacts', count(*) FROM orkesta.contacts;" </dev/null
          echo "==> Miembros por empresa (solo cifras)"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT left(m.tenant_id::text,8), string_agg(m.role||':'||m.status, ' ' ORDER BY m.role),
                   (SELECT count(*) FROM orkesta.contacts c WHERE c.tenant_id=m.tenant_id)
            FROM orkesta.memberships m GROUP BY m.tenant_id ORDER BY 3 DESC;" </dev/null
          echo "==> Permisos del usuario de la app"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('orkesta','postgres');
            SELECT tablename, tableowner FROM pg_tables WHERE schemaname='orkesta' AND tableowner <> 'orkesta';" </dev/null
          echo "==> Dirección pública"; grep -E '^(DOMAIN|PUBLIC_BASE_URL)=' .env
          docker compose exec -T app printenv PUBLIC_BASE_URL </dev/null
          echo "==> Datos que aún apuntan a Render"
          for t in proposals proposal_brands products automation_rules campaigns campaign_messages mailboxes users tenants platform_settings email_assets; do
            n=$(docker compose exec -T db psql -U postgres -d orkesta -At -c "SELECT count(*) FROM orkesta.$t x WHERE x::text ILIKE '%onrender%'" </dev/null 2>&1)
            echo "$t: $n"
          done
          docker compose exec -T db psql -U postgres -d orkesta -At -c "SELECT max(sent_at) FROM orkesta.campaign_messages WHERE campaign_messages::text ILIKE '%onrender%'" </dev/null
          echo "==> Imágenes de productos y propuestas (origen, cuántas, cuántas existen)"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            WITH imgs AS (
              SELECT 'producto' k, image_url u FROM orkesta.products WHERE image_url <> ''
              UNION ALL SELECT 'propuesta', i->>'image_url' FROM orkesta.proposals, jsonb_array_elements(items) i WHERE coalesce(i->>'image_url','') <> '')
            SELECT k, substring(u from '^(https?://[^/]+)?') AS host, (u ~ '/t/i/') AS propia, count(*),
                   count(a.id) AS existen
            FROM imgs LEFT JOIN orkesta.email_assets a ON a.id::text = substring(u from '/t/i/([0-9a-fA-F-]{36})')
            GROUP BY 1,2,3;" </dev/null | sed -E 's#(https?://)[^.|]*\.#\1*.#'
          echo "==> Entrenamientos y cargas desde el panel"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT left(created_at::text,16), action, left(target,40), detail::text FROM orkesta.admin_audit
            WHERE action IN ('directory.knowledge','directory.upload','directory.preset') ORDER BY created_at;" </dev/null
          echo "==> Por país: índice de personas / directorio / memoria de dominios"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT 'personas', country, source, count(*), count(email) FROM orkesta.people_index GROUP BY 2,3 ORDER BY 4 DESC LIMIT 20;
            SELECT 'directorio', country, source, count(*), count(domain) FROM orkesta.company_directory WHERE country IN ('US','CO','MX') GROUP BY 2,3 ORDER BY 4 DESC LIMIT 20;
            SELECT 'dominios', split_part(key,'|',1), source, count(*) FROM orkesta.company_domains GROUP BY 2,3 ORDER BY 4 DESC LIMIT 15;
            SELECT 'contactos', country_code, source, count(*) FROM orkesta.contacts GROUP BY 2,3 ORDER BY 4 DESC LIMIT 15;
            SELECT 'importaciones', left(created_at::text,16), totals::text FROM orkesta.imports ORDER BY created_at;" </dev/null
          echo "==> Calidad de datos (solo cifras)"
          docker compose exec -T db psql -U postgres -d orkesta -A -F ' | ' -c "
            SELECT source, email_status, count(*) AS n,
                   count(*) FILTER (WHERE email IS NOT NULL) AS con_correo,
                   count(*) FILTER (WHERE email_domain IS NOT NULL AND email_domain !~ '(gmail|hotmail|outlook|yahoo|live|icloud)\.') AS corporativos
            FROM orkesta.contacts GROUP BY 1,2 ORDER BY 3 DESC;
            SELECT 'dominios en contactos' AS cifra, count(DISTINCT email_domain) FROM orkesta.contacts WHERE email_domain IS NOT NULL
            UNION ALL SELECT 'de esos con formato aprendido', count(DISTINCT c.email_domain) FROM orkesta.contacts c JOIN orkesta.pattern_stats p ON p.domain=c.email_domain
            UNION ALL SELECT 'empresas en contactos', count(*) FROM orkesta.companies
            UNION ALL SELECT 'empresas de contactos sin dominio', count(*) FROM orkesta.companies WHERE domain IS NULL
            UNION ALL SELECT 'importaciones', count(*) FROM orkesta.imports
            UNION ALL SELECT 'formatos: dominios', count(DISTINCT domain) FROM orkesta.pattern_stats
            UNION ALL SELECT 'formatos: vistos', coalesce(sum(seen),0) FROM orkesta.pattern_stats
            UNION ALL SELECT 'formatos: confirmados', coalesce(sum(confirmed),0) FROM orkesta.pattern_stats
            UNION ALL SELECT 'formatos: rebotes', coalesce(sum(bounced),0) FROM orkesta.pattern_stats
            UNION ALL SELECT 'direcciones rebotadas', count(*) FROM orkesta.bounced_addresses
            UNION ALL SELECT 'memoria de dominios', count(*) FROM orkesta.company_domains
            UNION ALL SELECT 'directorio', count(*) FROM orkesta.company_directory
            UNION ALL SELECT 'directorio con dominio', count(*) FROM orkesta.company_directory WHERE domain IS NOT NULL
            UNION ALL SELECT 'indice personas', count(*) FROM orkesta.people_index
            UNION ALL SELECT 'indice con correo', count(*) FROM orkesta.people_index WHERE email IS NOT NULL;
            SELECT source, count(*) FROM orkesta.company_domains GROUP BY 1 ORDER BY 2 DESC;
            SELECT source, email_status, count(*) FROM orkesta.people_index GROUP BY 1,2 ORDER BY 3 DESC;
            SELECT c.email_status AS estado_contacto, r.status AS estado_envio, count(*)
            FROM orkesta.campaign_recipients r JOIN orkesta.contacts c ON c.id=r.contact_id
            WHERE r.sent_count > 0 GROUP BY 1,2 ORDER BY 1,3 DESC;
            SELECT status, count(*), count(content) AS con_archivo FROM orkesta.imports GROUP BY 1;
            SELECT left(created_at::text,16), status, totals FROM orkesta.enrichment_runs ORDER BY created_at DESC LIMIT 8;
            SELECT task, version, active, n_train, round((metrics->>'accuracy')::numeric,3) acc FROM orkesta.brain_models WHERE active;" </dev/null 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<correo>/g'
          echo "==> Contactos agregados por LinkedIn (solo cifras)"
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT left(created_at::date::text,10), count(*), count(job_title), count(company_name), count(country_code)
            FROM orkesta.contacts WHERE linkedin_url IS NOT NULL GROUP BY 1 ORDER BY 1 DESC LIMIT 8;" </dev/null
          echo "==> Buscador con un perfil público de prueba"
          docker compose exec -T app python - <<'PY' 2>&1 | tail -40
          from orkesta.core.config import get_settings
          from orkesta.core.db import get_session_factory
          from orkesta.research import serp
          from orkesta.research.fetch import Fetcher
          print("buscador configurado:", serp.enabled())
          factory = get_session_factory()
          for slug in ("williamhgates", "satyanadella"):
              stats = serp.SerpStats(budget=8)
              with Fetcher(factory) as f:
                  data = serp.call(f, "search", {"q": f"site:linkedin.com/in/{slug}", "num": 5, "hl": "es"}, stats)
                  for row in (data or {}).get("organic", [])[:2]:
                      print("  titulo:", row.get("title")); print("  resumen:", str(row.get("snippet"))[:200])
                  print(slug, "->", serp.profile_by_url(f, stats, slug), "errores:", stats.errors, stats.fatal)
          import httpx
          r = httpx.post("https://google.serper.dev/search", headers={"X-API-KEY": get_settings().serper_api_key}, json={"q": "orkesta"}, timeout=20)
          print("respuesta directa:", r.status_code, r.text[:160])
          PY
          echo "==> Errores recientes de la app"
          docker compose logs --since 3h app 2>&1 | grep -E -B2 -A25 'Traceback|ERROR|Exception' | tail -150
          echo "==> Últimas peticiones con error"
          docker compose logs --since 3h app 2>&1 | grep -E "\"(GET|POST|PUT|PATCH|DELETE) /api" | sed -E "s/[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/<ip>/" | tail -80
          REMOTE

      - name: Limpiar
        if: always()
        run: rm -f key.pem
