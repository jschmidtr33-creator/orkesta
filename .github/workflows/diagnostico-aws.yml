# Diagnóstico del servidor de AWS: estado de los contenedores, cifras de la base y los últimos
# errores de la aplicación. El repositorio es público: los correos y direcciones de conexión se
# ocultan antes de mostrarse.
name: diagnostico-aws

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.AWS_HOST }}
      KEY: ${{ secrets.AWS_SSH_KEY }}
    steps:
      - name: Conexión
        run: |
          install -m 600 /dev/null key.pem && printf '%s\n' "$KEY" > key.pem
          echo "SSH=ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@$HOST" >> "$GITHUB_ENV"

      - name: Estado
        run: |
          $SSH 'sudo bash -s' <<'REMOTE' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<correo>/g; s#(postgres(ql)?(\+psycopg)?://)[^ ]+#\1<oculto>#g'
          cd /opt/orkesta
          echo "==> Contenedores"; docker compose ps --format '{{.Name}} {{.State}} {{.Status}}'
          echo "==> Memoria"; free -m | head -2
          echo "==> Reinicios"; docker inspect orkesta-app-1 --format 'reinicios={{.RestartCount}} oom={{.State.OOMKilled}} salida={{.State.ExitCode}} inicio={{.State.StartedAt}}'
          dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -5
          echo "==> Últimas líneas de la app"; docker compose logs --tail 60 app 2>&1 | grep -v "/api/health"
          echo "==> Cerebro"
          docker compose exec -T db psql -U postgres -d orkesta -c "
            SELECT task, version AS v, active, trigger, n_train, n_test,
                   round((metrics->>'accuracy')::numeric*100,1) AS acierto,
                   round((baseline->>'accuracy')::numeric*100,1) AS reglas,
                   round((metrics->>'coverage')::numeric*100,1) AS cobertura,
                   to_char(created_at AT TIME ZONE 'America/Bogota','MM-DD HH24:MI') AS fecha, notes
            FROM orkesta.brain_models ORDER BY task, version;" </dev/null
          docker compose exec -T db psql -U postgres -d orkesta -At -c "
            SELECT 'cargos en el indice', count(*) FROM orkesta.people_index WHERE title <> '' UNION ALL
            SELECT 'correcciones humanas', count(*) FROM orkesta.brain_feedback;" </dev/null
          REMOTE

      - name: Limpiar
        if: always()
        run: rm -f key.pem
