name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pruebas, lint, tipos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-train.txt
          pip install -e ".[dev]"

      - name: Formato
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Tipos
        run: mypy

      - name: Pruebas
        run: pytest

      - name: Auditoría de dependencias
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip
          pip-audit -r requirements-train.txt --require-hashes --disable-pip

  railway-config:
    name: Tipos de la configuración de Railway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
