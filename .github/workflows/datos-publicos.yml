# Verifica las consultas de datos públicos (Wikidata) que el servidor ejecuta cada semana.
# Solo imprime cantidades por país: no publica nombres ni guarda archivos.
name: Datos públicos (verificación)

on:
  workflow_dispatch:
    inputs:
      paises:
        description: "Países (códigos separados por coma)"
        default: "MX,CO,CL,PE,AR"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
      - name: Directivos públicos por país
        run: |
          set -o pipefail
          python -m orkesta.catalog.public_people --out /tmp/directivos.csv.gz --countries "${{ inputs.paises }}" \
            | sed 's/^/::notice::Directivos /'
      - name: Empresas por país
        run: |
          python -m orkesta.catalog.wikidata_catalog --out /tmp/empresas.csv.gz --countries "${{ inputs.paises }}" \
            | sed 's/^/::notice::Empresas /'
