name: configurar-respaldo

# Conecta el bucket de S3 para los respaldos diarios y hace una copia de prueba.
# Se ejecuta a mano desde Actions con el nombre del bucket (no es un secreto).
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Nombre del bucket de S3 (ej. orkesta-respaldos-jenn)"
        required: true

permissions:
  contents: read

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar y probar
        env:
          HOST: ${{ secrets.AWS_HOST }}
          KEY: ${{ secrets.AWS_SSH_KEY }}
          BUCKET: ${{ github.event.inputs.bucket }}
        run: |
          case "$BUCKET" in (*[!a-z0-9.-]*|"") echo "Nombre de bucket inválido"; exit 1;; esac
          install -m 600 /dev/null key.pem && printf '%s\n' "$KEY" > key.pem
          SSH="ssh -i key.pem -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR ubuntu@$HOST"
          scp -q -i key.pem -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR deploy/aws/backup.sh ubuntu@$HOST:/tmp/
          $SSH "sudo install -m 755 /tmp/backup.sh /opt/orkesta/ && rm -f /tmp/backup.sh"
          $SSH "cd /opt/orkesta && (grep -q '^BACKUP_BUCKET=' .env && sudo sed -i 's/^BACKUP_BUCKET=.*/BACKUP_BUCKET=$BUCKET/' .env || echo 'BACKUP_BUCKET=$BUCKET' | sudo tee -a .env >/dev/null)"
          $SSH "which aws >/dev/null || (sudo snap install aws-cli --classic >/dev/null 2>&1 || sudo apt-get install -y awscli >/dev/null 2>&1)"
          if $SSH "sudo /opt/orkesta/backup.sh >/dev/null 2>&1"; then echo "Copia de la base: OK"; else echo "Copia de la base: FALLÓ"; fi
          $SSH "sudo docker compose -f /opt/orkesta/docker-compose.yml exec -T db psql -U postgres -d orkesta -At -c \"SELECT value->>'note' FROM orkesta.platform_settings WHERE key='respaldo'\" </dev/null" || true
          rm -f key.pem
