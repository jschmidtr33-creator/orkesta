# Publica la imagen de ORKESTA en GitHub (GHCR) y, si el servidor de AWS está configurado,
# la despliega allí por SSH. Secretos del repositorio (Settings → Secrets → Actions):
#   AWS_HOST     IP elástica o dominio del servidor
#   AWS_SSH_KEY  contenido de la llave privada .pem descargada al crear la instancia
name: deploy-aws

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/orkesta:latest
            ghcr.io/${{ github.repository_owner }}/orkesta:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS (solo si el servidor está configurado)
        env:
          HOST: ${{ secrets.AWS_HOST }}
          KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "Servidor de AWS aún no configurado: solo se publicó la imagen."
            exit 0
          fi
          install -m 600 /dev/null key.pem && printf '%s\n' "$KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@"$HOST" 'sudo /opt/orkesta/deploy.sh'
          rm -f key.pem
