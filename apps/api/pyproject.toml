[project]
name = "orkesta-api"
version = "0.1.0"
description = "ORKESTA: plataforma SaaS B2B de prospección, enriquecimiento, campañas y CRM"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"migrations/*" = ["E501", "S608"]
# Listas de vocabulario del motor (nombres, ciudades, industrias): líneas largas a propósito.
"orkesta/engine/*" = ["E501", "RUF012", "SIM102", "B905", "UP", "RUF005", "RUF015", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
